<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",

          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#ffb783",
                    "on-secondary-container": "#b2b3f2",
                    "background": "#131313",
                    "surface-bright": "#3a3939",

                    "error-container": "#93000a",
                    "primary": "#c0c1ff",

                    "tertiary": "#ffb783",

                    "secondary": "#c0c1ff",
                    "outline": "#908fa0",

                    "primary-fixed": "#e1e0ff",
                    "surface-dim": "#131313",
                    "primary-fixed-dim": "#c0c1ff",
                    "on-primary-container": "#0d0096",
                    "surface-container-lowest": "#0e0e0e",
                    "inverse-primary": "#494bd6",
                    "surface": "#131313",
                    "on-primary": "#1000a9",
                    "secondary-fixed": "#e1e0ff",
                    "surface-container-highest": "#353534",
                    "on-secondary-fixed-variant": "#404178",
                    "on-surface-variant": "#c7c4d7",
                    "on-secondary": "#292a60",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#353534",
                    "on-tertiary-fixed-variant": "#703700",
                    "secondary-container": "#42447b",
                    "inverse-on-surface": "#313030",
                    "surface-container-low": "#1c1b1b",
                    "primary-container": "#8083ff",
                    "surface-tint": "#c0c1ff",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "error": "#ffb4ab",
                    "outline-variant": "#464554",
                    "tertiary-container": "#d97721"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Space Grotesk"]
            }
          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-kinetic-gradient {
            background: linear-gradient(135deg, #c0c1ff 0%, #8083ff 100%);
        }
        .ghost-border {
            border: 1px solid rgba(199, 196, 215, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 w-full z-50 bg-[#0A0A0A] flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-150 text-indigo-500">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Inter'] uppercase tracking-widest text-xs font-bold text-[#e5e2e1]">NOMBRE DEL EVENTO</h1>
</div>
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-150 text-[#e5e2e1] hover:bg-[#353534] p-2 rounded-lg">
<span class="material-symbols-outlined">sync</span>
</button>
<div class="text-lg font-black text-[#e5e2e1]">LOGOTYPE</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-4 pt-16 pb-24 relative">
<!-- Background Decorative Element (Kinetic Monolith Style) -->
<div class="absolute inset-0 z-0 opacity-10 flex items-center justify-center pointer-events-none">
<span class="text-[20rem] font-black tracking-tighter select-none">VALIDATE</span>
</div>
<!-- Manual Validation Modal -->
<div class="relative z-10 w-full max-w-md bg-surface-container-low rounded-xl overflow-hidden shadow-[0_32px_64px_rgba(0,0,0,0.8)] ghost-border">
<!-- Status Stripe (Warning Orange) -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-[#F59E0B]"></div>
<div class="p-8">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-4 mb-8">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center text-[#F59E0B]">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<div class="space-y-1">
<span class="font-label text-[10px] tracking-widest uppercase text-outline">CONFIRMACIÓN DE VALIDACIÓN</span>
<h2 class="text-2xl font-black text-on-surface leading-tight">¿Deseas validar este ticket manualmente?</h2>
</div>
</div>
<!-- Info Card (Asymmetric Bento Style) -->
<div class="bg-surface-container-highest p-6 rounded-lg mb-8 border-l-2 border-primary/20">
<div class="flex flex-col gap-4">
<div class="space-y-1">
<span class="font-label text-[10px] uppercase text-primary tracking-tighter">NOMBRE DEL ASISTENTE</span>
<p class="text-xl font-bold text-on-surface">Juan Pérez</p>
</div>
<div class="flex justify-between items-end">
<div class="space-y-1">
<span class="font-label text-[10px] uppercase text-primary tracking-tighter">TIPO DE ENTRADA</span>
<p class="text-lg font-medium text-on-surface-variant">Entrada General</p>
</div>
<div class="text-right">
<span class="font-label text-[10px] uppercase text-outline tracking-tighter">ESTADO</span>
<p class="text-sm font-bold text-[#F59E0B]">PENDIENTE</p>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3">
<button class="bg-[#22C55E] text-black h-[56px] w-full font-black text-sm tracking-widest rounded-lg active:scale-[0.97] transition-all duration-100 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">check_circle</span>
                        SÍ, VALIDAR
                    </button>
<button class="h-[56px] w-full border border-outline-variant text-on-surface font-bold text-sm tracking-widest rounded-lg hover:bg-surface-container-high active:scale-[0.97] transition-all duration-100">
                        CANCELAR
                    </button>
</div>
</div>
<!-- Modal Footer Meta -->
<div class="bg-surface-container-lowest px-8 py-4 flex justify-between items-center border-t border-outline-variant/10">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span class="font-label text-[10px] text-outline">SISTEMA ACTIVO</span>
</div>
<span class="font-label text-[10px] text-outline">ID: TXN_99283</span>
</div>
</div>
</main>
<!-- BottomNavBar from JSON -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-lg bg-[#0A0A0A]/80 backdrop-blur-xl border-t border-[#c0c1ff]/15 shadow-[0_-8px_32px_rgba(0,0,0,0.5)] flex justify-around items-center w-full px-4 pb-6 pt-4">
<a class="flex flex-col items-center justify-center text-[#e5e2e1] py-3 px-8 hover:text-indigo-300 active:scale-97 transition-all duration-100" href="#">
<span class="material-symbols-outlined mb-1">qr_code_scanner</span>
<span class="font-['Space_Grotesk'] text-[10px] font-bold tracking-tighter uppercase">ESCANEAR</span>
</a>
<a class="flex flex-col items-center justify-center bg-gradient-to-br from-[#c0c1ff] to-[#8083ff] text-black rounded-lg py-3 px-8 scale-105 active:scale-97 transition-all duration-100" href="#">
<span class="material-symbols-outlined mb-1">keyboard</span>
<span class="font-['Space_Grotesk'] text-[10px] font-bold tracking-tighter uppercase">BÚSQUEDA</span>
</a>
</nav>
</body></html>
