<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#ffb783",
                    "on-secondary-container": "#ffccbc",
                    "background": "#131313",
                    "surface-bright": "#3a3939",
                    "on-tertiary-fixed": "#301400",
                    "error-container": "#93000a",
                    "primary": "#EF8354",
                    "on-error": "#690005",
                    "tertiary": "#ffb783",
                    "on-tertiary-container": "#452000",
                    "on-tertiary": "#4f2500",
                    "surface-container-high": "#2a2a2a",
                    "on-background": "#e5e2e1",
                    "on-surface": "#e5e2e1",
                    "on-primary-fixed": "#3e1c00",
                    "secondary": "#EF8354",
                    "outline": "#908fa0",
                    "surface-container": "#201f1f",
                    "inverse-surface": "#e5e2e1",
                    "tertiary-fixed": "#ffdcc5",
                    "on-secondary-fixed": "#3e1c00",
                    "secondary-fixed-dim": "#EF8354",
                    "primary-fixed": "#ffdbc9",
                    "surface-dim": "#131313",
                    "primary-fixed-dim": "#EF8354",
                    "on-primary-container": "#331100",
                    "surface-container-lowest": "#0e0e0e",
                    "inverse-primary": "#EF8354",
                    "surface": "#131313",
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#ffdbc9",
                    "surface-container-highest": "#353534",
                    "on-secondary-fixed-variant": "#713700",
                    "on-surface-variant": "#c7c4d7",
                    "on-secondary": "#4f2500",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#353534",
                    "on-tertiary-fixed-variant": "#703700",
                    "secondary-container": "#713700",
                    "inverse-on-surface": "#313030",
                    "surface-container-low": "#1c1b1b",
                    "primary-container": "#EF8354",
                    "surface-tint": "#EF8354",
                    "on-primary-fixed-variant": "#713700",
                    "error": "#ffb4ab",
                    "outline-variant": "#464554",
                    "tertiary-container": "#d97721"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Space Grotesk"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0A0A0A;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#0A0A0A] flex items-center justify-between px-6 h-16">
<div class="flex items-center gap-4">
<button class="text-[#e5e2e1] active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] uppercase tracking-widest text-xs font-bold text-[#EF8354]">Configuración</h1>
</div>
<div class="text-lg font-black text-[#e5e2e1]">NOMBRE DEL EVENTO</div>
<button class="text-[#e5e2e1] active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
</button>
</header>
<main class="pt-24 px-6 max-w-md mx-auto space-y-8">
<!-- Profile Anchor Section -->
<section class="flex flex-col items-center text-center space-y-4">
<div class="relative">
<div class="w-24 h-24 rounded-lg bg-gradient-to-br from-[#EF8354] to-[#d97721] p-[2px]">
<div class="w-full h-full rounded-lg bg-surface-container-lowest flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="person">person</span>
</div>
</div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 bg-green-500 rounded-full border-4 border-background"></div>
</div>
<div>
<p class="font-label text-[10px] text-outline-variant uppercase tracking-widest mb-1">Operador Activo</p>
<h2 class="text-2xl font-black text-on-surface tracking-tight">staff.madrid@lema.io</h2>
</div>
</section>
<!-- Kinetic Monolith Grid -->
<div class="grid grid-cols-1 gap-3">
<!-- Permissions Card -->
<div class="bg-surface-container-low p-5 rounded-lg flex items-center justify-between group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 flex items-center justify-center bg-surface-container-highest rounded-lg text-primary">
<span class="material-symbols-outlined" data-icon="photo_camera">photo_camera</span>
</div>
<div>
<p class="font-label text-[11px] text-primary uppercase tracking-tighter">Permisos</p>
<h3 class="text-lg font-bold leading-tight">Cámara</h3>
</div>
</div>
<div class="flex items-center gap-2 bg-green-500/10 px-3 py-1 rounded-full border border-green-500/20">
<span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>
<span class="font-label text-[10px] font-bold text-green-500">CONCEDIDO</span>
</div>
</div>
<!-- Device Info Card -->
<div class="bg-surface-container-low p-5 rounded-lg space-y-4">
<div class="flex items-center gap-4">
<div class="w-10 h-10 flex items-center justify-center bg-surface-container-highest rounded-lg text-outline">
<span class="material-symbols-outlined" data-icon="info">info</span>
</div>
<div>
<p class="font-label text-[11px] text-outline-variant uppercase tracking-tighter">Versión de la app</p>
<h3 class="text-lg font-bold leading-tight">v1.2.4 <span class="text-outline-variant text-sm font-normal">(Build 443)</span></h3>
</div>
</div>
</div>
<!-- Support / Legal Asymmetric Layout -->
<div class="flex gap-3">
<div class="flex-1 bg-surface-container-low p-4 rounded-lg flex flex-col justify-between aspect-square">
<span class="material-symbols-outlined text-outline-variant" data-icon="description">description</span>
<p class="font-label text-[11px] font-bold uppercase leading-none">Términos y Condiciones</p>
</div>
<div class="flex-1 bg-surface-container-low p-4 rounded-lg flex flex-col justify-between aspect-square">
<span class="material-symbols-outlined text-outline-variant" data-icon="help_center">help_center</span>
<p class="font-label text-[11px] font-bold uppercase leading-none">Soporte Técnico</p>
</div>
</div>
</div>
<!-- Danger Zone -->
<div class="pt-8 space-y-4">
<button class="w-full h-14 flex items-center justify-center gap-3 border-2 border-error/30 text-error font-bold uppercase tracking-widest text-sm rounded-lg active:scale-[0.97] transition-all duration-100 hover:bg-error/5">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
                CERRAR SESIÓN
            </button>
<p class="text-center font-label text-[9px] text-outline-variant uppercase tracking-[0.2em] opacity-50">
                Operaciones Seguras © 2024 LEMA.IO
            </p>
</div>
</main>
<!-- BottomNavBar -->
</body></html>
