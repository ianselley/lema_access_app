<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#ffb783",
                    "on-secondary-container": "#b2b3f2",
                    "background": "#131313",
                    "surface-bright": "#3a3939",
                    "on-tertiary-fixed": "#301400",
                    "error-container": "#93000a",
                    "primary": "#c0c1ff",
                    "on-error": "#690005",
                    "tertiary": "#ffb783",
                    "on-tertiary-container": "#452000",
                    "on-tertiary": "#4f2500",
                    "surface-container-high": "#2a2a2a",
                    "on-background": "#e5e2e1",
                    "on-surface": "#e5e2e1",
                    "on-primary-fixed": "#07006c",
                    "secondary": "#c0c1ff",
                    "outline": "#908fa0",
                    "surface-container": "#201f1f",
                    "inverse-surface": "#e5e2e1",
                    "tertiary-fixed": "#ffdcc5",
                    "on-secondary-fixed": "#13144a",
                    "secondary-fixed-dim": "#c0c1ff",
                    "primary-fixed": "#e1e0ff",
                    "surface-dim": "#131313",
                    "primary-fixed-dim": "#c0c1ff",
                    "on-primary-container": "#0d0096",
                    "surface-container-lowest": "#0e0e0e",
                    "inverse-primary": "#494bd6",
                    "surface": "#131313",
                    "on-primary": "#1000a9",
                    "secondary-fixed": "#e1e0ff",
                    "surface-container-highest": "#353534",
                    "on-secondary-fixed-variant": "#404178",
                    "on-surface-variant": "#c7c4d7",
                    "on-secondary": "#292a60",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#353534",
                    "on-tertiary-fixed-variant": "#703700",
                    "secondary-container": "#42447b",
                    "inverse-on-surface": "#313030",
                    "surface-container-low": "#1c1b1b",
                    "primary-container": "#8083ff",
                    "surface-tint": "#c0c1ff",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "error": "#ffb4ab",
                    "outline-variant": "#464554",
                    "tertiary-container": "#d97721"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Space Grotesk"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-gradient {
            background: linear-gradient(135deg, #c0c1ff 0%, #8083ff 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#0A0A0A] flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-150 text-[#e5e2e1] hover:bg-[#353534] p-2 rounded-lg">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Inter'] uppercase tracking-widest text-xs font-bold text-indigo-500">NOMBRE DEL EVENTO</h1>
</div>
<div class="flex items-center gap-2">
<span class="text-lg font-black text-[#e5e2e1]">LOGOTIPO</span>
<button class="active:scale-95 transition-transform duration-150 text-[#e5e2e1] hover:bg-[#353534] p-2 rounded-lg">
<span class="material-symbols-outlined">sync</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-20 pb-32">
<!-- Status Indicator / Kinetic Monolith Layout -->
<div class="w-full max-w-md flex flex-col gap-8">
<!-- Hero Error Section -->
<div class="relative bg-surface-container-low rounded-xl overflow-hidden p-8 flex flex-col items-center text-center">
<!-- Status Stripe -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-error"></div>
<!-- Animated-feel Icon Circle -->
<div class="w-24 h-24 rounded-full bg-error-container/20 flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-error text-5xl" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<div class="space-y-2">
<p class="font-label text-error font-bold tracking-widest text-xs uppercase">CÓDIGO NO ENCONTRADO</p>
<h2 class="font-headline font-black text-4xl leading-none tracking-tighter text-on-surface">NO ENCONTRADO</h2>
</div>
<div class="mt-8 p-4 bg-surface-container-highest rounded-lg w-full">
<p class="font-body text-sm text-on-surface-variant">Ticket no existe en la base de datos actual. Verifica el código o busca manualmente.</p>
</div>
</div>
<!-- Bento Operations Grid -->
<div class="grid grid-cols-1 gap-4">
<!-- Primary Action -->
<button class="h-16 kinetic-gradient text-black font-headline font-extrabold text-lg rounded-lg flex items-center justify-center gap-3 active:scale-95 transition-all duration-100 shadow-xl shadow-primary/10">
<span class="material-symbols-outlined font-bold">qr_code_scanner</span>
                    VOLVER A ESCANEAR
                </button>
<!-- Secondary Asymmetric Options -->
<div class="grid grid-cols-2 gap-4">
<button class="h-14 bg-surface-container-high hover:bg-surface-bright text-on-surface font-label font-bold text-xs flex flex-col items-center justify-center gap-1 rounded-lg active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary">keyboard</span>
                        Búsqueda manual
                    </button>
<button class="h-14 bg-surface-container-high hover:bg-surface-bright text-on-surface font-label font-bold text-xs flex flex-col items-center justify-center gap-1 rounded-lg active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary">history</span>
                        Historial
                    </button>
</div>
</div>
<!-- Kinetic Context Meta -->
<div class="flex items-center justify-between px-2 opacity-50">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-surface-tint animate-pulse"></div>
<span class="font-label text-[10px] font-bold tracking-widest uppercase">Scanner Active</span>
</div>
<span class="font-label text-[10px] font-bold tracking-widest uppercase">Inténtalo de nuevo</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-lg bg-[#0A0A0A]/80 backdrop-blur-xl border-t border-[#c0c1ff]/15 shadow-[0_-8px_32px_rgba(0,0,0,0.5)]">
<div class="flex justify-around items-center w-full px-4 pb-6 pt-4">
<!-- Active Tab: ESCANEAR -->
<a class="flex flex-col items-center justify-center bg-gradient-to-br from-[#c0c1ff] to-[#8083ff] text-black rounded-lg py-3 px-8 scale-105 active:scale-97 transition-all duration-100" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="font-['Space_Grotesk'] text-[10px] font-bold tracking-tighter">ESCANEAR</span>
</a>
<!-- Inactive Tab: BÚSQUEDA -->
<a class="flex flex-col items-center justify-center text-[#e5e2e1] py-3 px-8 hover:text-indigo-300 active:scale-97 transition-all duration-100" href="#">
<span class="material-symbols-outlined">keyboard</span>
<span class="font-['Space_Grotesk'] text-[10px] font-bold tracking-tighter">BÚSQUEDA</span>
</a>
</div>
</nav>
<!-- Decoration / Texture Layer -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-0">
<div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
</div>
</body></html>
