<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#ffb783",
                    "on-secondary-container": "#b2b3f2",
                    "background": "#131313",
                    "surface-bright": "#3a3939",
                    "on-tertiary-fixed": "#301400",
                    "error-container": "#93000a",
                    "primary": "#c0c1ff",
                    "on-error": "#690005",
                    "tertiary": "#ffb783",
                    "on-tertiary-container": "#452000",
                    "on-tertiary": "#4f2500",
                    "surface-container-high": "#2a2a2a",
                    "on-background": "#e5e2e1",
                    "on-surface": "#e5e2e1",
                    "on-primary-fixed": "#07006c",
                    "secondary": "#c0c1ff",
                    "outline": "#908fa0",
                    "surface-container": "#201f1f",
                    "inverse-surface": "#e5e2e1",
                    "tertiary-fixed": "#ffdcc5",
                    "on-secondary-fixed": "#13144a",
                    "secondary-fixed-dim": "#c0c1ff",
                    "primary-fixed": "#e1e0ff",
                    "surface-dim": "#131313",
                    "primary-fixed-dim": "#c0c1ff",
                    "on-primary-container": "#0d0096",
                    "surface-container-lowest": "#0e0e0e",
                    "inverse-primary": "#494bd6",
                    "surface": "#131313",
                    "on-primary": "#1000a9",
                    "secondary-fixed": "#e1e0ff",
                    "surface-container-highest": "#353534",
                    "on-secondary-fixed-variant": "#404178",
                    "on-surface-variant": "#c7c4d7",
                    "on-secondary": "#292a60",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#353534",
                    "on-tertiary-fixed-variant": "#703700",
                    "secondary-container": "#42447b",
                    "inverse-on-surface": "#313030",
                    "surface-container-low": "#1c1b1b",
                    "primary-container": "#8083ff",
                    "surface-tint": "#c0c1ff",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "error": "#ffb4ab",
                    "outline-variant": "#464554",
                    "tertiary-container": "#d97721"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Space Grotesk"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-gradient {
            background: linear-gradient(135deg, #c0c1ff 0%, #8083ff 100%);
        }
        .glass-panel {
            background: rgba(58, 57, 57, 0.6);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-[#0A0A0A] fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-150 text-indigo-500">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] uppercase tracking-widest text-xs font-bold text-indigo-400">NOMBRE DEL EVENTO</h1>
</div>
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-150 text-[#e5e2e1] hover:bg-[#353534] p-2 rounded-lg">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
</button>
<div class="text-lg font-black text-[#e5e2e1] hidden md:block">IDENTITY.CORE</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 mt-16 mb-24 flex flex-col items-center justify-center px-6 relative">
<!-- Pulse Indicator for 'Live' status -->
<div class="absolute top-8 right-8 flex items-center gap-2">
<span class="h-2 w-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label text-[10px] tracking-widest text-outline-variant uppercase">Sistema Activo</span>
</div>
<div class="w-full max-w-md flex flex-col items-center">
<!-- Header Text -->
<div class="text-center mb-12">
<p class="font-label text-primary text-[10px] tracking-[0.2em] uppercase mb-2">Entrada Manual</p>
<h2 class="text-4xl font-extrabold tracking-tighter text-on-surface uppercase">Ingresa el código</h2>
</div>
<!-- Manual Input Display -->
<div class="w-full mb-8">
<div class="bg-surface-container-lowest border-b-2 border-primary-container p-6 flex justify-center items-center h-24 rounded-t-lg">
<input class="bg-transparent border-none text-center text-4xl font-black tracking-[0.3em] text-on-surface w-full focus:ring-0 placeholder:text-surface-container-highest uppercase" maxlength="8" placeholder="AX79-B02" type="text"/>
</div>
<div class="bg-surface-container-low p-3 flex justify-between items-center rounded-b-lg">
<span class="font-label text-[10px] text-outline">LATENCY: 12ms</span>
<span class="font-label text-[10px] text-outline">SECURE LAYER V.4</span>
</div>
</div>
<!-- Kinetic Keypad (Custom Component) -->
<div class="grid grid-cols-3 gap-3 w-full mb-10">
<!-- Numbers 1-9 -->
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xl font-bold rounded-lg border border-white/5">1</button>
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xl font-bold rounded-lg border border-white/5">2</button>
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xl font-bold rounded-lg border border-white/5">3</button>
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xl font-bold rounded-lg border border-white/5">4</button>
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xl font-bold rounded-lg border border-white/5">5</button>
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xl font-bold rounded-lg border border-white/5">6</button>
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xl font-bold rounded-lg border border-white/5">7</button>
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xl font-bold rounded-lg border border-white/5">8</button>
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xl font-bold rounded-lg border border-white/5">9</button>
<!-- Bottom Row -->
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xl font-bold rounded-lg border border-white/5 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="backspace">backspace</span>
</button>
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xl font-bold rounded-lg border border-white/5">0</button>
<button class="h-16 bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-xs font-label text-outline rounded-lg border border-white/5">A-Z</button>
</div>
<!-- CTAs -->
<div class="w-full space-y-6">
<button class="kinetic-gradient w-full h-[56px] text-black font-black uppercase tracking-widest text-sm rounded-lg active:scale-95 transition-all shadow-[0_8px_24px_rgba(128,131,255,0.3)]">
                    VALIDAR CÓDIGO
                </button>
<button class="w-full flex items-center justify-center gap-2 group">
<span class="font-label text-xs font-bold text-outline group-hover:text-on-surface transition-colors uppercase tracking-widest">Cancelar</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-lg bg-[#0A0A0A]/80 backdrop-blur-xl border-t border-[#c0c1ff]/15 shadow-[0_-8px_32px_rgba(0,0,0,0.5)] flex justify-around items-center w-full px-4 pb-6 pt-4">
<a class="flex flex-col items-center justify-center text-[#e5e2e1] py-3 px-8 hover:text-indigo-300 active:scale-97 transition-all duration-100" href="#">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-['Space_Grotesk'] text-[10px] font-bold tracking-tighter uppercase mt-1">ESCANEAR</span>
</a>
<a class="flex flex-col items-center justify-center bg-gradient-to-br from-[#c0c1ff] to-[#8083ff] text-black rounded-lg py-3 px-8 scale-105 active:scale-97 transition-all duration-100" href="#">
<span class="material-symbols-outlined" data-icon="keyboard" style="font-variation-settings: 'FILL' 1;">keyboard</span>
<span class="font-['Space_Grotesk'] text-[10px] font-bold tracking-tighter uppercase mt-1">BÚSQUEDA</span>
</a>
</nav>
<!-- Background Decorative Elements -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-20">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/20 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-container/20 blur-[120px]"></div>
</div>
</body></html>
